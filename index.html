<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주차별 질의답변수 집계표</title>
<style>
  :root{
    --navy:#1F4E79; --navy-d:#163b5c; --red:#C00000;
    --f-id:#DDEBF7; --f-fam:#E2EFDA; --f-nm:#BDD7EE; --f-tot:#FFE699; --f-cum:#F8CBAD;
    --bd:#BFBFBF; --bd-l:#E3E3E3;
    --bg:#F4F6F8; --panel:#fff; --ink:#1a1a1a; --ink-2:#5b6570; --zero:#c4c9ce;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.5 "Malgun Gothic","맑은 고딕",-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:100%;padding:16px}
  h1{margin:0 0 2px;font-size:19px;letter-spacing:-.02em}
  .sub{font-size:13px;font-weight:700;color:var(--navy);margin:2px 0 1px}
  .sub2{color:var(--ink-2);font-size:11px;margin-bottom:14px}

  .panel{background:var(--panel);border:1px solid var(--bd-l);border-radius:8px;
         padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .panel h2{margin:0 0 10px;font-size:13px;color:var(--navy);letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  label{display:block;font-size:11px;color:var(--ink-2);margin-bottom:3px;font-weight:600}
  input[type=text],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--bd);
         border-radius:5px;font:inherit;background:#fff;color:var(--ink)}
  #drop{border:2px dashed var(--bd);border-radius:8px;padding:20px 14px;text-align:center;
        background:#fafbfc;transition:background .12s,border-color .12s;margin-bottom:12px}
  #drop.over{border-color:var(--navy);background:#eef4fa}
  #drop b{font-size:14px}
  #drop.hide{display:none}
  .dropnote{font-size:11px;color:var(--ink-2);margin:6px 0 0}
  .srctop{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .srctop #status{flex:1;min-width:240px;margin-top:0}
  .chipwrap{margin-bottom:10px}
  .chiplabel{font-size:11px;color:var(--ink-2);margin-bottom:6px}
  .chiplabel b{color:var(--navy)}
  #chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 12px;border:1px solid var(--bd);background:#fff;color:var(--ink);
        border-radius:8px;font:inherit;font-size:12px;cursor:pointer;text-align:left;
        display:inline-flex;flex-direction:column;gap:1px;line-height:1.3}
  .chip .nm{font-weight:700}
  .chip:hover{background:#eef4fa;border-color:var(--navy)}
  .chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip .cnt{font-size:10px;font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .chip .cnt b{font-weight:700}
  .chip[aria-pressed=true] .cnt{color:#dce9f5}
  td.cid{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--ink-2)}
  td.mg{vertical-align:top;background:#fff;font-weight:600;
        border-bottom:1px solid var(--bd);box-shadow:inset 0 -1px 0 var(--bd)}
  #srcstat{margin-top:8px;font-size:11px;display:none}
  #srcstat.on{display:block}
  #srcstat table{border-collapse:collapse;font-size:11px}
  #srcstat td{border:1px solid var(--bd-l);padding:3px 8px;white-space:nowrap}
  #srcstat td.n{text-align:right;font-variant-numeric:tabular-nums}
  #srcstat td.bad{color:#8a1c1c}
  .dupwarn{background:#fdecec;border:1px solid #f3c2c2;color:#8a1c1c;
        border-radius:5px;padding:9px 11px;margin-bottom:8px;font-size:12px;line-height:1.6}
  .srcsum{margin-top:5px;color:var(--ink-2)}
  details.srcfold{margin-top:2px}
  details.srcfold>summary{cursor:pointer;list-style:none;display:inline-flex;
        align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--bd-l);
        border-radius:6px;background:#fff;color:var(--ink-2);font-size:11px;
        user-select:none}
  details.srcfold>summary::-webkit-details-marker{display:none}
  details.srcfold>summary:hover{background:#eef4fa;border-color:var(--navy)}
  details.srcfold>summary b{color:var(--ink)}
  details.srcfold>summary .srchint{color:var(--navy);font-weight:600}
  details.srcfold>summary .srchint::before{content:"▸ "}
  details.srcfold[open]>summary .srchint::before{content:"▾ "}
  details.srcfold[open]>summary .srchint{visibility:visible}
  details.srcfold>summary .bad{color:#8a1c1c;font-weight:600}
  details.srcfold>table{margin-top:7px}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(31,78,121,.35);outline-offset:-1px;border-color:var(--navy)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  button{padding:8px 15px;border:1px solid var(--navy);background:var(--navy);color:#fff;
         border-radius:5px;font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:var(--navy-d)}
  button.ghost{background:#fff;color:var(--navy)}
  button.ghost:hover{background:#eef4fa}
  button:disabled{opacity:.5;cursor:not-allowed}
  .hint{font-size:11px;color:var(--ink-2);margin-top:6px;line-height:1.6}
  code{background:#eef1f4;padding:1px 4px;border-radius:3px;font-size:11px}

  #status{font-size:12px;white-space:pre-wrap;margin-top:10px;padding:9px 11px;
          border-radius:5px;display:none}
  #status.on{display:block}
  #status.info{background:#eef4fa;border:1px solid #cfe0ee;color:#1a3f5f}
  #status.err{background:#fdecec;border:1px solid #f3c2c2;color:#8a1c1c}
  #status.ok{background:#edf7ee;border:1px solid #c7e6ca;color:#1d5423}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--bd-l);border-radius:8px;padding:11px 13px}
  .card .k{font-size:11px;color:var(--ink-2);font-weight:600}
  .card .v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .card .v .u{font-size:12px;font-weight:600;margin-left:1px;color:var(--ink-2)}
  .card .d{font-size:10px;color:var(--ink-2);margin-top:4px;line-height:1.45}

  .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:2px solid var(--bd-l)}
  .tabs button{border:1px solid var(--bd-l);border-bottom:0;background:#eef1f4;color:var(--ink-2);
        border-radius:7px 7px 0 0;padding:8px 18px;font-size:13px;font-weight:700;
        margin-bottom:-2px;cursor:pointer}
  .tabs button:hover{background:#e3e9ef;color:var(--ink)}
  .tabs button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .seg{display:inline-flex;border:1px solid var(--navy);border-radius:5px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:#fff;color:var(--navy);padding:7px 13px}
  .seg button[aria-pressed=true]{background:var(--navy);color:#fff}
  .spacer{flex:1}

  .tablebox{background:var(--panel);border:1px solid var(--bd-l);border-radius:8px;
            overflow:auto;max-height:76vh}
  table{border-collapse:separate;border-spacing:0;font-size:12px}
  th,td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);
        padding:4px 7px;white-space:nowrap}
  thead th{position:sticky;background:var(--navy);color:#fff;font-weight:700;
           text-align:center;z-index:3;font-size:11px;line-height:1.35}
  thead tr:first-child th{top:0;height:24px}
  thead tr:nth-child(2) th{top:24px}
  thead th.tot{background:var(--red)}
  thead th .l2{display:block;font-weight:500;opacity:.92;font-size:10px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.num.z{color:var(--zero)}
  td.g{text-align:left}
  tr.sub-fam td{background:var(--f-fam);font-weight:700}
  tr.sub-id  td{background:var(--f-id);font-weight:700}
  tr.sub-nm  td{background:var(--f-nm);font-weight:700}
  tr.total   td{background:var(--f-tot);font-weight:700}
  tr.cumul   td{background:var(--f-cum);font-weight:700}
  tbody tr:hover td{filter:brightness(.97)}
  td.tot,th.tot{font-weight:700;border-left:2px solid var(--red)}
  /* 좌측 그룹 열 고정 */
  .stick{position:sticky;background:#fff;z-index:2}
  thead .stick{z-index:6;background:var(--navy);color:#fff}
  /* 전체 총계 / 누적 총계 행은 세로 스크롤과 무관하게 하단 고정 */
  tr.total td, tr.cumul td{position:sticky;z-index:4}
  tr.total td.stick, tr.cumul td.stick{z-index:5}
  tr.total td{box-shadow:inset 0 1px 0 var(--bd)}
  tr.sub-fam .stick{background:var(--f-fam)}
  tr.sub-id  .stick{background:var(--f-id)}
  tr.sub-nm  .stick{background:var(--f-nm)}
  tr.total   .stick{background:var(--f-tot)}
  tr.cumul   .stick{background:var(--f-cum)}
  .fold{cursor:pointer;margin-right:5px;font-size:12px;line-height:1;
        user-select:none;opacity:.75}
  .fold:hover{opacity:1}
  #depth button{font-size:12px;padding:7px 11px}
  .empty-wk{opacity:.55}
  /* 오늘이 포함된 주차 열 강조 — 배경색을 덮지 않고 위에 얇게 덧칠 */
  thead th.cur{background:#0E7C5A}
  thead th.cur .badge{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;
        background:#fff;color:#0E7C5A;font-size:9px;font-weight:800;vertical-align:1px}
  td.cur{background-image:linear-gradient(rgba(14,124,90,.13),rgba(14,124,90,.13));
        border-left:2px solid #0E7C5A;border-right:2px solid #0E7C5A;font-weight:700}
  thead th.cur{border-left:2px solid #0E7C5A;border-right:2px solid #0E7C5A}
  .rptbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .rptbar label{margin:0;font-size:12px;font-weight:700;color:var(--ink)}
  .rptbar select{width:auto;padding:7px 12px;font-weight:600}
  .rptnote{font-size:11px;color:var(--ink-2);line-height:1.6}

  .rptdoc{background:#fff;border:1px solid var(--bd-l);border-radius:10px;
        padding:26px 28px;max-width:1040px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .rptsec{margin-bottom:30px}
  .rptsec:last-of-type{margin-bottom:0}
  .rptsec h3{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--navy);
        display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
  .rptsec h3::before{content:"";width:3px;height:16px;background:var(--navy);border-radius:2px}

  table.rpt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;
        border:1px solid #D6DCE4;border-radius:8px;overflow:hidden}
  table.rpt th,table.rpt td{padding:10px 14px;text-align:center;white-space:nowrap;
        border-bottom:1px solid #E9EDF2;border-right:0}
  /* 메인 표의 thead 규칙(흰 글자)이 여기까지 오지 않도록 명시 */
  table.rpt thead th{position:static;background:var(--navy);color:#fff;font-weight:700;
        font-size:12px;letter-spacing:.01em;border-bottom:0;z-index:auto}
  table.rpt tbody tr:last-child td{border-bottom:0}
  table.rpt td.lbl{text-align:left;font-weight:600;color:var(--ink)}
  table.rpt td.num{text-align:right;font-variant-numeric:tabular-nums}
  table.rpt td.sep{border-right:1px solid #E9EDF2}
  table.rpt td.grp{text-align:left;font-weight:700;color:var(--navy);
        background:#F6F9FC;vertical-align:middle;border-right:1px solid #E9EDF2}
  table.rpt tbody tr:hover td{background:#F8FAFC}
  table.rpt tbody tr:hover td.grp{background:#EEF4FA}
  table.rpt tr.sum td{background:#EDF3F9;font-weight:700;
        border-top:2px solid var(--navy);border-bottom:0}
  table.rpt tr.sum:hover td{background:#E6EEF7}
  table.rpt td.up{color:#C0392B;font-weight:700}
  table.rpt td.dn{color:#1F6FB2;font-weight:700}
  table.rpt td.na{color:#BFC6CE}
  table.rpt thead th .mk{color:#FFD27F;font-weight:800}
  table.rpt td .uniq{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:3px;
        background:var(--navy);color:#fff;font-size:9px;font-weight:700;vertical-align:1px}

  .rptfoot{margin-top:18px;padding:13px 16px;background:#F7F9FB;
        border-left:3px solid #C9D3DE;border-radius:0 6px 6px 0;
        font-size:11.5px;line-height:1.9;color:var(--ink-2)}
  .rptfoot b{color:var(--ink)}
  details.notes{margin-top:12px;font-size:12px;color:var(--ink-2)}
  details.notes summary{cursor:pointer;font-weight:600;color:var(--navy)}
  details.notes ul{margin:8px 0 0;padding-left:18px;line-height:1.75}
</style>
</head>
<body>
<div class="wrap">
  <h1>주차별 질의답변수 집계표</h1>
  <div class="sub" id="period">데이터를 읽는 중…</div>
  <div class="sub2">토요일 시작 ~ 다음 주 금요일 마감 · 채널 ID 기준 집계 · 채널명 현행화 · 중복 제거 없음</div>

  <div class="panel" id="srcpanel">
    <div id="drop">
      <b id="dropTitle">로그데이터.xlsx 를 여기로 끌어다 놓으세요</b>
      <div class="dropnote" id="dropNote">또는 아래 버튼으로 직접 고르세요 · 파일은 브라우저 안에서만 처리되며 어디로도 전송되지 않습니다</div>
      <div class="row" style="justify-content:center">
        <button id="pick">파일 선택</button>
      </div>
    </div>
    <div class="srctop">
      <div id="status"></div>
      <div class="row" style="margin:0">
        <button id="reload" class="ghost" disabled>새로고침</button>
        <button id="xlsx" class="ghost" disabled>엑셀 내려받기</button>
        <button id="csv" class="ghost" disabled>CSV 내려받기</button>
        <select id="tz" style="width:auto">
          <option value="utc">원본 UTC</option>
          <option value="kst">원본 KST</option>
        </select>
        <button id="pick2" class="ghost">다른 파일 선택</button>
      </div>
    </div>
    <input type="file" id="files" multiple accept=".xlsx,.csv,.txt" hidden>
    <div id="srcstat"></div>
  </div>

  <div id="out" hidden>
    <div class="tabs" id="tabs">
      <button data-p="week" aria-pressed="true">📅 주차별</button>
      <button data-p="month" aria-pressed="false">🗓️ 월별</button>
      <button data-p="report" aria-pressed="false">📋 월간 보고</button>
    </div>
    <div class="cards" id="cards"></div>
    <div class="chipwrap">
      <div class="chiplabel">채널 그룹 — 버튼의 숫자는 <b>채널 수 / 질의답변수</b></div>
      <div id="chips"></div>
    </div>
    <div id="mainview">
    <div class="toolbar">
      <div class="seg" id="depth">
        <button data-d="chan" title="채널 소계만 보기">📁 채널</button>
        <button data-d="fam"  title="계열 소계까지 보기">📂 계열</button>
        <button data-d="model" aria-pressed="true" title="모든 모델 행 보기">📄 모델</button>
      </div>
      <div class="spacer"></div>
      <input type="text" id="q" placeholder="채널명 / 채널 ID / 모델 검색" style="max-width:240px">
    </div>
    <div class="tablebox"><table id="tbl"></table></div>
    </div>

    <div id="reportview" hidden>
      <div class="rptbar">
        <label for="rmonth" style="margin:0">보고 대상 월</label>
        <select id="rmonth"></select>
        <button id="rxlsx" class="ghost">엑셀 내려받기</button>
        <span class="rptnote" id="rscope"></span>
      </div>
      <div class="rptdoc">
        <div class="rptsec">
          <h3>총괄표</h3>
          <table class="rpt" id="rpt1"></table>
        </div>
        <div class="rptsec">
          <h3>모델별 이용 현황</h3>
          <table class="rpt" id="rpt2"></table>
        </div>
        <div class="rptfoot" id="rfoot"></div>
      </div>
    </div>

    <details class="notes">
      <summary>집계 기준</summary>
      <ul id="notes"></ul>
    </details>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const NEED = ["Chat ID","채널 ID","채널명","생성일시","AI 모델"];
/* 선택 컬럼 — 있으면 이용자/실사용자 수를 정확히 계산한다.
   PNU 도우미처럼 비로그인 이용이 가능한 채널은 빈칸으로 오며, 빈칸은 행마다 1명으로 센다. */
const UIDCOL = ["식별번호", "이용자 식별번호", "사용자 식별번호", "user id", "uid"];
const TOTCOL = "전체 누적 합계", BAND = "질의답변수";
const LS = "pnu-week-agg-cfg";

let FILES = [];        // 마지막으로 선택한 File 객체들 (다시 집계용)

/* ---------- 상태 ---------- */
let STATE = null;      // 집계 결과
let GROUP = "전체";
let FOCUSED = false;   // 첫 렌더에서만 오늘 주차로 이동
const FOLD_CH  = new Set();   // 접힌 채널명
const FOLD_FAM = new Set();   // 접힌 "채널명␀계열"
let DEPTH = "model";          // model | fam | chan
let PERIOD = "week";          // week | month  (주차별 / 월별 탭)
const AXIS = () => PERIOD === "week" ? STATE.weeks : STATE.months;
const VEC  = c => PERIOD === "week" ? c.v : c.mv;    // 채널 그룹 필터

/* ---------- 유틸 ---------- */
const fmt = n => n.toLocaleString("ko-KR");
function setStatus(msg, kind){
  const el = $("#status");
  el.textContent = msg; el.className = "on " + (kind || "info");
}
/* ---------- CSV 파서 (RFC4180) ---------- */
function parseCSV(text){
  // 따옴표가 전혀 없으면 줄/쉼표 분할로 처리 (84MB·84만행이 몇 초 -> 1초 이하)
  if (text.indexOf('"') === -1){
    const out = [];
    for (const ln of text.split("\n")){
      if (!ln) continue;
      out.push((ln.charCodeAt(ln.length - 1) === 13 ? ln.slice(0, -1) : ln).split(","));
    }
    return out;
  }
  const rows = [];
  let row = [], f = "", q = false, i = 0;
  const n = text.length;
  while (i < n){
    const c = text[i];
    if (q){
      if (c === '"'){
        if (text[i+1] === '"'){ f += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      f += c; i++; continue;
    }
    if (c === '"'){ q = true; i++; continue; }
    if (c === ','){ row.push(f); f = ""; i++; continue; }
    if (c === '\r'){ i++; continue; }
    if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ""; i++; continue; }
    f += c; i++;
  }
  if (f.length || row.length){ row.push(f); rows.push(row); }
  return rows;
}

/* ---------- 날짜: 원본 → KST 자정 기준 일자 ---------- */
function toKstDayUTC(raw, mode){
  const s = String(raw || "").trim();
  if (!s) return null;
  let ms;
  if (/[Zz]$|[+-]\d\d:?\d\d$/.test(s)){           // 타임존 명시 → 그대로 해석
    ms = Date.parse(s);
  } else {
    // 타임존 없음: 설정에 따라 UTC 또는 KST 로 간주
    const m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
    if (m){
      ms = Date.UTC(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
      if (mode === "kst") ms -= 9*3600e3;         // KST 표기 → UTC 로 되돌림
    } else {
      ms = Date.parse(s);
    }
  }
  if (!isFinite(ms)) return null;
  // KST(+9) 로 옮긴 뒤 UTC 게터로 날짜를 읽어 자정으로 절단
  const k = new Date(ms + 9*3600e3);
  return Date.UTC(k.getUTCFullYear(), k.getUTCMonth(), k.getUTCDate());
}
// 토요일 시작 주의 시작일(UTC ms)
function weekStart(dayUTC){
  const dow = new Date(dayUTC).getUTCDay();       // 일0 … 토6
  return dayUTC - ((dow + 1) % 7) * 86400e3;      // 토→0, 일→1, … 금→6
}
// "M월 N주(MM/DD~MM/DD)" : 마감 금요일이 속한 달의 N번째 금요일
function weekLabel(wsMs){
  const s = new Date(wsMs), e = new Date(wsMs + 6*86400e3);
  const p = d => String(d).padStart(2,"0");
  const n = Math.floor((e.getUTCDate() - 1) / 7) + 1;
  return {
    l1: `${e.getUTCMonth()+1}월 ${n}주`,
    l2: `(${p(e.getUTCMonth()+1)}/${p(e.getUTCDate())})`.replace(/^\(/, "(")
        .replace(")", ""),                          // 자리표시 (아래에서 재구성)
    range: `(${p(s.getUTCMonth()+1)}/${p(s.getUTCDate())}~${p(e.getUTCMonth()+1)}/${p(e.getUTCDate())})`,
    start: `${s.getUTCFullYear()}-${p(s.getUTCMonth()+1)}-${p(s.getUTCDate())}`,
    end:   `${e.getUTCFullYear()}-${p(e.getUTCMonth()+1)}-${p(e.getUTCDate())}`
  };
}

function ymd(ms){
  const d = new Date(ms), p = n => String(n).padStart(2, "0");
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`;
}

/* ---------- 모델 계열 ---------- */
function family(m){
  const x = String(m || "").toLowerCase();
  if (x.includes("gemma"))  return "GEMMA";   // google/gemma-* : gemini 보다 먼저
  if (x.includes("claude")) return "CLAUDE";
  if (x.includes("gemini")) return "GEMINI";
  if (x.includes("grok"))   return "GROK";
  if (x.includes("gpt"))    return "GPT";
  return "기타";
}

/* ---------- 로컬 파일 읽기 ---------- */
/* UTF-8 로 먼저 시도하고, 한글 헤더가 깨지면 CP949(euc-kr) 로 다시 디코딩 */
async function readFileText(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  const head = t.slice(0, 400);
  const okUtf8 = NEED.some(k => head.includes(k));
  if (!okUtf8 && !head.includes("Chat ID")){
    try{
      const t2 = new TextDecoder("euc-kr").decode(buf);
      if (NEED.some(k => t2.slice(0, 400).includes(k))) t = t2;
    }catch(e){}
  }
  return t.replace(/^﻿/, "");
}

/* ---------- 집계 ----------
   중복 제거하지 않습니다. Chat ID 가 겹치는 행도 각각 1건으로 셉니다.       */
function aggregate(tables, tzMode){
  const lastName = new Map();      // 채널 ID -> [최신ts, 채널명]
  const cells    = new Map();      // "채널ID 모델" -> {cid, model, fam, w:Map(주시작->건수), t}
  const wsSet    = new Set();
  const mkSet    = new Set();
  const srcStats = [];
  let nRaw = 0, nBadDate = 0, nDupId = 0;
  let dMin = Infinity, dMax = -Infinity;
  /* 이용자 계산용 행 단위 기록 (임의 조건으로 고유 인원을 세기 위해 유지) */
  let hasUid = false;
  const uTab = new Map();               // 식별번호 문자열 -> 인덱스
  const rowM = [], rowC = [], rowF = [], rowU = [];   // 월 / 채널ID / 계열 / 이용자(-1=비로그인)
  const cidTab = new Map();             // 채널ID -> 인덱스
  const famTab = new Map();
  const seenId = new Map();        // Chat ID -> 최초 등장 파일 index (제외하지 않고 통계만)
  let crossDup = 0;                // 서로 다른 파일에 같은 Chat ID 가 있는 건수
  const crossPairs = new Map();    // "파일A ↔ 파일B" -> 건수

  let fileIdx = -1;
  for (const {tab, text} of tables){
    fileIdx++;
    let sRaw = 0, sBad = 0, sCross = 0;
    const rows = parseCSV(text);
    if (!rows.length) continue;
    const head = rows[0].map(h => h.trim().replace(/^\uFEFF/, ""));
    const ix = {};
    for (const k of NEED){
      const j = head.findIndex(h => h === k);
      if (j < 0) throw new Error(`"${tab}" 에 컬럼 '${k}' 가 없습니다.\n찾은 헤더: ${head.join(" | ")}`);
      ix[k] = j;
    }
    // 식별번호 컬럼(선택) 위치
    const uj = head.findIndex(h => UIDCOL.some(u => h.toLowerCase() === u.toLowerCase()));
    if (uj >= 0) hasUid = true;
    for (let r = 1; r < rows.length; r++){
      const row = rows[r];
      if (row.length === 1 && !row[0]) continue;
      const chat = (row[ix["Chat ID"]] || "").trim();
      if (!chat) continue;
      nRaw++; sRaw++;
      if (seenId.has(chat)){
        nDupId++;
        const first = seenId.get(chat);
        if (first !== fileIdx){
          crossDup++; sCross++;
          const k = `${tables[first].tab.split("  ")[0]} ↔ ${tab.split("  ")[0]}`;
          crossPairs.set(k, (crossPairs.get(k) || 0) + 1);
        }
      } else seenId.set(chat, fileIdx);

      const rawTs = row[ix["생성일시"]];
      const day = toKstDayUTC(rawTs, tzMode);
      if (day == null){ nBadDate++; sBad++; continue; }
      const ws = weekStart(day);
      wsSet.add(ws);
      const dt = new Date(day);
      const mk = dt.getUTCFullYear() * 12 + dt.getUTCMonth();   // 월 키
      mkSet.add(mk);
      if (day < dMin) dMin = day;
      if (day > dMax) dMax = day;

      const cid   = (row[ix["채널 ID"]] || "").trim() || "(없음)";
      const cname = (row[ix["채널명"]]  || "").trim() || "(없음)";
      const model = (row[ix["AI 모델"]] || "").trim() || "(없음)";

      const ts = Date.parse(String(rawTs)) || day;
      const cur = lastName.get(cid);
      if (!cur || ts >= cur[0]) lastName.set(cid, [ts, cname]);

      const k = cid + " " + model;
      let a = cells.get(k);
      if (!a){ a = { cid, model, fam: family(model), w: new Map(), m: new Map(), t: 0 }; cells.set(k, a); }
      a.w.set(ws, (a.w.get(ws) || 0) + 1);
      a.m.set(mk, (a.m.get(mk) || 0) + 1);
      a.t++;

      // 행 단위 기록
      if (!cidTab.has(cid)) cidTab.set(cid, cidTab.size);
      const fm = a.fam;
      if (!famTab.has(fm)) famTab.set(fm, famTab.size);
      let ui = -1;
      if (uj >= 0){
        const uv = (row[uj] || "").trim();
        if (uv){
          if (!uTab.has(uv)) uTab.set(uv, uTab.size);
          ui = uTab.get(uv);
        }
      }
      rowM.push(mk); rowC.push(cidTab.get(cid)); rowF.push(famTab.get(fm)); rowU.push(ui);
    }
    srcStats.push({ label: tab, raw: sRaw, bad: sBad, cross: sCross });
  }
  if (!cells.size) throw new Error("집계할 데이터가 없습니다. 컬럼과 값 형식을 확인하세요.");

  // 달력 기준 연속 주차 (데이터 없는 주도 0으로 유지)
  const minWs = Math.min(...wsSet), maxWs = Math.max(...wsSet);
  const weeks = [];
  for (let w = minWs; w <= maxWs; w += 7*86400e3) weeks.push(w);
  const W = weeks.length;
  const wIdx = new Map(weeks.map((w, i) => [w, i]));

  // 월 축 (빈 달도 유지)
  const minMk = Math.min(...mkSet), maxMk = Math.max(...mkSet);
  const mks = [];
  for (let k = minMk; k <= maxMk; k++) mks.push(k);
  const M = mks.length;
  const mIdx = new Map(mks.map((k, i) => [k, i]));
  const pad2 = n => String(n).padStart(2, "0");
  const months = mks.map(k => {
    const y = Math.floor(k / 12), mo = k % 12;
    const last = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
    return { l1: `${mo + 1}월`, range: `(${y})`,
             start: `${y}-${pad2(mo + 1)}-01`, end: `${y}-${pad2(mo + 1)}-${pad2(last)}`,
             empty: !mkSet.has(k) };
  });

  // Map -> 고정 길이 배열, 채널명 현행화
  const list = [];
  const famTot = {};
  let total = 0;
  for (const a of cells.values()){
    const v = new Int32Array(W);
    for (const [ws, n] of a.w) v[wIdx.get(ws)] = n;
    const mv = new Int32Array(M);
    for (const [mk, n] of a.m) mv[mIdx.get(mk)] = n;
    a.v = v; a.mv = mv; a.w = null; a.m = null;
    a.name = (lastName.get(a.cid) || [0, "(없음)"])[1];
    famTot[a.fam] = (famTot[a.fam] || 0) + a.t;
    total += a.t;
    list.push(a);
  }

  // mk(연*12+월) -> 월 index 로 치환하고 TypedArray 로 압축
  const N = rowM.length;
  const aM = new Int16Array(N), aC = new Int32Array(N),
        aF = new Int8Array(N),  aU = new Int32Array(N);
  for (let i = 0; i < N; i++){
    aM[i] = mIdx.get(rowM[i]); aC[i] = rowC[i]; aF[i] = rowF[i]; aU[i] = rowU[i];
  }
  const cidName = new Array(cidTab.size);
  for (const [cid, i] of cidTab) cidName[i] = (lastName.get(cid) || [0, "(없음)"])[1];
  const famName = new Array(famTab.size);
  for (const [f, i] of famTab) famName[i] = f;

  return {
    hasUid, rowN: N, aM, aC, aF, aU, cidName, famName,
    nUsers: uTab.size,
    weeks: weeks.map(w => ({ ms: w, ...weekLabel(w), empty: !wsSet.has(w) })),
    months,
    cells: list,
    total, nRaw, nBadDate, nDupId, srcStats,
    crossDup, crossPairs: [...crossPairs.entries()].sort((a, b) => b[1] - a[1]),
    nFiles: tables.length,
    dataFrom: isFinite(dMin) ? ymd(dMin) : null,
    dataTo:   isFinite(dMax) ? ymd(dMax) : null,
    emptyWeeks: weeks.filter(w => !wsSet.has(w)).map(w => weekLabel(w)),
    famTot, tzMode,
    nChan:  new Set(list.map(a => a.name)).size,
    nCid:   new Set(list.map(a => a.cid)).size,
    nModel: new Set(list.map(a => a.model)).size
  };
}

/* ---------- 행 구성 (소계/총계) ---------- */
function addArr(dst, src){ for (let i = 0; i < src.length; i++) dst[i] += src[i]; }
function sumOf(list, W){ const a = new Int32Array(W); for (const x of list) addArr(a, VEC(x)); return a; }

/* 채널 표시 순서: 지정 목록 우선(접두사 그룹은 정확일치 먼저), 나머지는 누적 내림차순 */
const PRIORITY = ["MCP Beta","PNU 도우미","행정 도우미","학사 도우미","입학 도우미","Plato 도우미"];
const PN = PRIORITY.map(x => x.replace(/\s/g, "").toLowerCase());
function chanRank(name){
  const n = String(name).replace(/\s/g, "").toLowerCase();
  for (let i = 0; i < PN.length; i++){
    if (n === PN[i]) return [i, 0];
    if (n.startsWith(PN[i])) return [i, 1];
  }
  return [PN.length, 0];
}

/* 필터 버튼용 채널 그룹 — PRIORITY 6개 + 그 외 */
function chanGroup(name){
  const r = chanRank(name);
  return r[0] < PN.length ? PRIORITY[r[0]] : "그 외";
}

function buildRows(S, q, group){
  const W = AXIS().length;
  let cells = S.cells;
  if (group && group !== "전체") cells = cells.filter(c => chanGroup(c.name) === group);
  if (q){
    const s = q.toLowerCase();
    cells = cells.filter(c => c.name.toLowerCase().includes(s)
                           || c.model.toLowerCase().includes(s)
                           || c.cid.toLowerCase().includes(s));
  }
  const rows = [];
  if (!cells.length) return rows;

  const byName = new Map();
  for (const c of cells){
    if (!byName.has(c.name)) byName.set(c.name, []);
    byName.get(c.name).push(c);
  }
  const names = [...byName.entries()]
    .map(([n, l]) => [n, l, l.reduce((s, x) => s + x.t, 0), chanRank(n)])
    .sort((a, b) => a[3][0] - b[3][0] || a[3][1] - b[3][1]
                 || b[2] - a[2] || String(a[0]).localeCompare(String(b[0]), "ko"));

  // 채널 ID 표기: 그 채널 전체가 단일 채널 ID 로 특정될 때만 표시한다.
  // MCP Beta 처럼 채널 ID 가 여러 개인 채널은 전 행을 비운다(일부 줄만 ID 가 뜨면 오해 소지).
  if (!S._chanIds){
    const m = new Map();
    for (const c of S.cells){
      if (!m.has(c.name)) m.set(c.name, new Set());
      m.get(c.name).add(c.cid);
    }
    S._chanIds = m;
  }
  const idLabel = name => {
    const all = S._chanIds.get(name);
    return all && all.size === 1 ? [...all][0] : "";
  };

  let blk = 0;                     // 채널 블록 번호 (행 병합 단위)
  for (const [name, list] of names){
    blk++;
    const chClosed = FOLD_CH.has(name);
    if (chClosed){
      // 채널 접힘 → 채널 소계 한 줄만
      rows.push({ k: "sub-nm", g: [name, idLabel(name), "", "채널 소계"],
                  v: sumOf(list, W), blk, chKey: name, chClosed: true });
      continue;
    }
    const byFam = new Map();
    for (const c of list){
      if (!byFam.has(c.fam)) byFam.set(c.fam, []);
      byFam.get(c.fam).push(c);
    }
    const fams = [...byFam.entries()]
      .map(([k, l]) => [k, l, l.reduce((s, x) => s + x.t, 0)])
      .sort((a, b) => b[2] - a[2]);

    for (const [fm, l] of fams){
      const fk = name + "␀" + fm;
      const famClosed = FOLD_FAM.has(fk);
      if (!famClosed){
        // 같은 (채널명, 계열, 모델) 은 여러 채널 ID 에 걸쳐 있어도 한 행으로 합산
        const byModel = new Map();
        for (const c of l){
          let m = byModel.get(c.model);
          if (!m){ m = { model: c.model, v: new Int32Array(W), t: 0, ids: [] }; byModel.set(c.model, m); }
          addArr(m.v, VEC(c)); m.t += c.t; m.ids.push(c);
        }
        const items = [...byModel.values()]
          .sort((a, b) => b.t - a.t || String(a.model).localeCompare(String(b.model)));
        for (const m of items)
          rows.push({ k: "data", g: [name, idLabel(name), fm, m.model], v: m.v,
                      blk, chKey: name, famKey: fk });
      }
      rows.push({ k: "sub-fam", g: [name, idLabel(name), fm, `${fm} 소계`],
                  v: sumOf(l, W), blk, chKey: name, famKey: fk, famClosed });
    }
    rows.push({ k: "sub-nm", g: [name, idLabel(name), "", "채널 소계"],
                v: sumOf(list, W), blk, chKey: name });
  }

  const grand = sumOf(cells, W);
  rows.push({ k: "total", g: ["전체 총계", "", "", ""], v: grand, blk: -1 });
  const cum = new Int32Array(W);
  let run = 0;
  for (let i = 0; i < W; i++){ run += grand[i]; cum[i] = run; }
  rows.push({ k: "cumul", g: ["누적 총계", "", "", ""], v: cum, totOverride: run, blk: -2 });
  return rows;
}

/* ---------- 렌더 ---------- */
const GCOLS  = ["채널명", "채널 ID", "모델 계열", "AI 모델"];
const GWIDTH = [200, 210, 92, 210];
const GOFFS  = GWIDTH.reduce((a, w, i) => (a.push(i ? a[i-1] + GWIDTH[i-1] : 0), a), []);

function renderChips(){
  const S = STATE;
  // 그룹별 채널명 수 · 채널 ID 수 · 질의답변수
  const agg = new Map();
  const put = (g, c) => {
    let o = agg.get(g);
    if (!o){ o = { n: new Set(), ids: new Set(), t: 0 }; agg.set(g, o); }
    o.n.add(c.name); o.ids.add(c.cid); o.t += c.t;
  };
  for (const c of S.cells){ put("전체", c); put(chanGroup(c.name), c); }

  const order = ["전체", ...PRIORITY, "그 외"];
  $("#chips").innerHTML = order.filter(g => agg.has(g)).map(g => {
    const o = agg.get(g);
    const pct = S.total ? (o.t / S.total * 100).toFixed(1) : "0";
    const tip = `${g} · 채널 ${o.n.size}개 (채널 ID ${fmt(o.ids.size)}개)`
              + ` · 질의답변수 ${fmt(o.t)}건 · 전체의 ${pct}%`;
    return `<button class="chip" data-g="${escapeHtml(g)}" aria-pressed="${g === GROUP}" title="${escapeHtml(tip)}">`
         + `<span class="nm">${escapeHtml(g)}</span>`
         + `<span class="cnt"><b>${o.n.size}</b>채널 / <b>${fmt(o.t)}</b>건</span></button>`;
  }).join("");
  for (const b of $("#chips").querySelectorAll(".chip"))
    b.onclick = () => { GROUP = b.dataset.g; render(); };
}

function render(){
  const S = STATE; if (!S) return;
  for (const b of document.querySelectorAll("#tabs button"))
    b.setAttribute("aria-pressed", String(b.dataset.p === PERIOD));
  $("#mainview").hidden   = PERIOD === "report";
  $("#reportview").hidden = PERIOD !== "report";
  $("#cards").hidden = PERIOD === "report";
  $("#chips").closest(".chipwrap").hidden = PERIOD === "report";
  if (PERIOD === "report"){
    $("#out").hidden = false;
    renderReport();
    $("#csv").disabled = false;
    document.title = "월간 보고 — 질의답변수";
    return;
  }
  const M_total = S.total;
  const rows = buildRows(S, $("#q").value.trim(), GROUP);
  const AX = AXIS();
  const W = AX.length;

  const h = [];
  h.push("<thead><tr>");
  GCOLS.forEach((c, i) => h.push(
    `<th rowspan="2" class="stick g" style="left:${GOFFS[i]}px;min-width:${GWIDTH[i]}px;width:${GWIDTH[i]}px">${c}</th>`));
  h.push(`<th colspan="${W}">${BAND}</th>`);
  h.push(`<th rowspan="2" class="tot">전체 누적<br>합계</th>`);
  h.push("</tr><tr>");
  const CW = currentWeekIdx();
  AX.forEach((w, i) => {
    const cur = i === CW.idx;
    const cls = [w.empty ? "empty-wk" : "", cur ? "cur" : ""].filter(Boolean).join(" ");
    const unit = PERIOD === "week" ? "주" : "달";
    const tip = `${w.start} ~ ${w.end}` + (cur ? (CW.exact ? ` · 오늘이 포함된 ${unit}` : ` · 오늘에 가장 가까운 ${unit}`) : "");
    h.push(`<th class="${cls}" title="${tip}">${w.l1}${cur ? '<span class="badge">오늘</span>' : ""}`
         + `<span class="l2">${w.range}</span></th>`);
  });
  h.push("</tr></thead><tbody>");

  if (!rows.length){
    h.push(`<tr><td colspan="${GCOLS.length + W + 1}" style="padding:18px;text-align:center;color:#5b6570">`
         + `해당하는 데이터가 없습니다.</td></tr>`);
  }
  // 병합 계산 — 값이 아니라 "블록" 단위로 묶는다.
  //   채널명(0) · 채널 ID(1) : 채널 블록 전체를 하나로 (값이 비어 있어도 병합)
  //   모델 계열(2)          : 채널 블록 안에서 같은 계열이 이어지는 구간
  // 전체 총계 / 누적 총계 행은 각자 고유 블록이라 자연히 병합에서 빠진다.
  const MERGE = [0, 1, 2];
  const mkey = (r, col) => col < 2 ? `b${r.blk}` : `b${r.blk}|${r.g[2]}`;
  const span = rows.map(() => ({}));
  for (const col of MERGE){
    let i = 0;
    while (i < rows.length){
      const k = mkey(rows[i], col);
      let j = i + 1;
      while (j < rows.length && mkey(rows[j], col) === k) j++;
      span[i][col] = j - i;
      for (let x = i + 1; x < j; x++) span[x][col] = 0;
      i = j;
    }
  }

  for (let ri = 0; ri < rows.length; ri++){
    const r = rows[ri];
    h.push(`<tr class="${r.k}">`);
    r.g.forEach((g, i) => {
      if (MERGE.includes(i)){
        const n = span[ri][i];
        if (n === 0) return;                       // 위 셀에 병합됨
        const rs = n > 1 ? ` rowspan="${n}"` : "";
        const mg = n > 1 ? " mg" : "";
        let fold = "";
        if (i === 0 && r.chKey){
          const cl = FOLD_CH.has(r.chKey);

               + `title="${cl ? "펼치기" : "접기"}">${cl ? "📁" : "📂"}</span>`;

  $("#tbl").innerHTML = h.join("");
  for (const el of $("#tbl").querySelectorAll(".fold")){

      ev.stopPropagation();

  renderChips();

  const shown = rows.length ? rows[rows.length - 2].v.reduce((a, b) => a + b, 0) : 0;
  const pct = n => M_total ? (n / M_total * 100).toFixed(1) + "%" : "";
  const w0 = AX[0], w1 = AX[W - 1];

  const nEmpty = AX.filter(w => w.empty).length;
  $("#cards").innerHTML = [
    card("전체 질의답변수", fmt(S.total), "건",
         `중복 제거 없이 센 전체 로그 행${S.nDupId ? ` · Chat ID 중복 ${fmt(S.nDupId)}건 포함` : ""}`),
    GROUP === "전체" ? null
      : card(`${escapeHtml(GROUP)} 소계`, fmt(shown), "건", `전체의 ${pct(shown)}`),
    PERIOD === "week"
      ? card("집계 주차", W, "주",
             `${w0.start} ~ ${w1.end} · 토요일 시작~금요일 마감`
             + (nEmpty ? ` · 로그 없는 주 ${nEmpty}주 포함` : ""))
      : card("집계 개월", W, "개월",
             `${w0.start} ~ ${w1.end} · 달력 월 기준(KST)`
             + (nEmpty ? ` · 로그 없는 달 ${nEmpty}개월 포함` : "")),
    card("채널", S.nChan, "개", `채널 ID ${fmt(S.nCid)}개 · 이름은 최신값으로 현행화`),
    card("AI 모델", S.nModel, "개", `${fam.length}개 계열로 분류 · 미분류 없음`),
    ...fam.map(([k, v]) => card(k + " 계열", fmt(v), "건", `전체의 ${pct(v)}`))
  ].filter(Boolean).join("");

  for (const b of document.querySelectorAll("#depth button"))
    b.setAttribute("aria-pressed", String(b.dataset.d === DEPTH));
  for (const b of document.querySelectorAll("#tabs button"))
    b.setAttribute("aria-pressed", String(b.dataset.p === PERIOD));
  document.title = (PERIOD === "week" ? "주차별" : "월별") + " 질의답변수 집계표";

  const fromTo = (S.dataFrom && S.dataTo) ? `${S.dataFrom} ~ ${S.dataTo}`
               : `${w0.start} ~ ${w1.end}`;
  const cwTxt = CW.idx >= 0
    ? ` · 오늘 ${CW.exact ? "포함" : "인접"} ${PERIOD === "week" ? "주차" : "월"}: ${AX[CW.idx].l1}${AX[CW.idx].range}`
    : "";
  $("#period").textContent =
    `데이터 기간 ${fromTo} · 총 ${S.weeks.length}주차 / ${S.months.length}개월 · ${fmt(S.total)}건${cwTxt}`;

  $("#notes").innerHTML = [
    `주차: 토요일 시작 ~ 다음 주 금요일 마감. 라벨은 <b>마감 금요일이 속한 달의 N번째 금요일</b> 기준 (예: 03/28~04/03 → 4월 1주).`,
    `시간대: 원본을 <b>${S.tzMode === "utc" ? "UTC" : "KST"}</b>로 해석해 KST(UTC+9) 날짜로 집계.`,
    `<b>중복 제거하지 않습니다.</b> 모든 행을 각각 1건으로 셉니다 (읽은 행 ${fmt(S.nRaw)}건 중 Chat ID가 겹치는 행 ${fmt(S.nDupId)}건도 모두 포함).`,
    `집계 키는 <b>채널 ID</b>, 표기 채널명은 해당 채널 ID의 <b>가장 최근 기록에 나타난 이름</b>(현행화).`,
    `채널명 · 채널 ID · 모델 계열 열은 <b>같은 값이 이어지는 구간을 병합</b>해 보여줍니다.`,
    `<b>채널 ID 열</b>: 채널 ID 가 하나로 특정되는 줄에만 표시합니다. 여러 채널 ID 가 합쳐진 줄(MCP Beta 등)은 비워 둡니다 — 검색창으로는 채널 ID 조회가 됩니다.`,
    S.nBadDate ? `생성일시를 해석할 수 없어 제외한 행: ${fmt(S.nBadDate)}건.` : null,
    S.emptyWeeks.length
      ? `데이터가 없는 주차: ${S.emptyWeeks.map(w => w.range).join(", ")} — 0으로 표기(주차 번호는 달력 기준 연속).`
      : `데이터가 없는 주차: 없음.`,
    `모델 계열: 모델명 소문자 포함 검사 — gemma→GEMMA, claude→CLAUDE, gemini→GEMINI, grok→GROK, gpt→GPT (<code>google/gemma-*</code> 때문에 gemma를 먼저 판정).`,
    `채널 표시 순서: MCP Beta &gt; PNU 도우미 &gt; 행정 도우미 &gt; 학사 도우미 &gt; 입학 도우미 &gt; Plato 도우미 &gt; 그 외. 접두사가 같은 채널은 같은 그룹에 묶이며 정확일치가 먼저.`,
    `<b>누적 총계</b> 행: 각 주차 칸 = 1주차부터 해당 주차까지의 누계(좌→우 러닝합).`
  ].filter(Boolean).map(s => `<li>${s}</li>`).join("");

  $("#out").hidden = false;
  $("#csv").disabled = false;
  $("#xlsx").disabled = false;
  pinBottomRows();
  requestAnimationFrame(() => {
    pinBottomRows();
    if (!FOCUSED){ FOCUSED = true; focusCurrentWeek(); }

}

/* 전체 총계 · 누적 총계 행을 표 하단에 붙여 고정한다 (행 높이를 실측해 오프셋 지정) */
function pinBottomRows(){
  const tb = $("#tbl").tBodies[0];
  if (!tb) return;
  const rs = [...tb.rows];
  const cumul = rs.find(r => r.className === "cumul");
  const total = rs.find(r => r.className === "total");
  if (cumul) for (const td of cumul.cells) td.style.bottom = "0px";
  if (total && cumul){
    const hh = cumul.getBoundingClientRect().height;
    for (const td of total.cells) td.style.bottom = hh + "px";
  } else if (total){
    for (const td of total.cells) td.style.bottom = "0px";
  }
}

/* 오늘(KST) 이 속한 주차 index. 없으면 가장 가까운 주차. */
function currentWeekIdx(){
  const S = STATE; if (!S) return -1;
  const today = new Date(Date.now() + 9 * 3600e3);   // KST 기준 오늘
  const t = Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate());
  let best = -1, bestDist = Infinity, exact = -1;
  AXIS().forEach((w, i) => {
    const a = Date.parse(w.start + "T00:00:00Z"), b = Date.parse(w.end + "T00:00:00Z");
    const dist = t < a ? a - t : (t > b ? t - b : 0);
    if (dist === 0) exact = i;
    if (dist < bestDist){ bestDist = dist; best = i; }
  });
  return { idx: best, exact: exact >= 0 };
}

/* 오늘 주차가 보이도록 가로 스크롤 */
function focusCurrentWeek(){
  const S = STATE; if (!S) return;
  const box = $(".tablebox");
  const ths = $("#tbl").tHead ? [...$("#tbl").tHead.rows[1].cells] : [];
  if (!ths.length) return;
  const best = currentWeekIdx().idx;
  if (best < 0) return;
  const th = ths[best];
  if (!th) return;
  const frozen = GWIDTH.reduce((a, b) => a + b, 0);
  box.scrollLeft = Math.max(0, th.offsetLeft - frozen - 8);
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

/* ============================================================
   서식 있는 xlsx 직접 생성 (외부 라이브러리 없음)
   - 배경색 / 굵기 / 테두리 / 가운데·왼쪽·오른쪽 정렬 / #,##0
   - 셀 병합 · 틀 고정(E3) · 열 너비
   - ZIP 은 무압축(store)으로 직접 기록
   ============================================================ */
const XQ = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]));

/* ---- CRC32 ---- */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* ---- 무압축 ZIP ---- */
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + name.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true); dv.setUint16(12, 0x2821, true);   // 시각 고정
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);

    const ch = new Uint8Array(46 + name.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true); cv.setUint16(14, 0x2821, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + data.length;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  const all = [...parts, ...central, end];
  const total = all.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  for (const b of all){ out.set(b, p); p += b.length; }
  return out;
}

/* ---- 스타일 테이블 ---- */
function makeStyles(){
  const fills = ["none", "gray125"];                       // 0,1 은 규격상 고정
  const fillIdx = new Map();
  const fill = rgb => {
    if (!rgb) return 0;
    if (!fillIdx.has(rgb)){ fills.push(rgb); fillIdx.set(rgb, fills.length - 1); }
    return fillIdx.get(rgb);
  };
  const fonts = [], fontIdx = new Map();
  const font = (bold, color, sz) => {
    const k = `${bold}|${color}|${sz}`;
    if (!fontIdx.has(k)){ fonts.push({ bold, color, sz }); fontIdx.set(k, fonts.length - 1); }
    return fontIdx.get(k);
  };
  const borders = [], borderIdx = new Map();
  const border = kind => {
    if (!borderIdx.has(kind)){ borders.push(kind); borderIdx.set(kind, borders.length - 1); }
    return borderIdx.get(kind);
  };
  const xfs = [], xfIdx = new Map();
  const xf = o => {
    const k = JSON.stringify(o);
    if (!xfIdx.has(k)){ xfs.push(o); xfIdx.set(k, xfs.length - 1); }
    return xfIdx.get(k);
  };
  font(false, "FF1A1A1A", 10);          // 0 기본
  border("none");                        // 0 기본
  xf({ f: 0, fl: 0, b: 0, al: "left", num: 0 });   // 0 기본
  return { fills, fonts, borders, xfs, fill, font, border, xf,
    xml(){
      const fillXml = this.fills.map(f =>
        f === "none" ? '<fill><patternFill patternType="none"/></fill>'
        : f === "gray125" ? '<fill><patternFill patternType="gray125"/></fill>'
        : `<fill><patternFill patternType="solid"><fgColor rgb="${f}"/>`
          + `<bgColor indexed="64"/></patternFill></fill>`).join("");
      const fontXml = this.fonts.map(f =>
        `<font><sz val="${f.sz}"/><color rgb="${f.color}"/>`
        + `<name val="맑은 고딕"/>${f.bold ? "<b/>" : ""}</font>`).join("");
      const bXml = this.borders.map(k => {
        if (k === "none") return "<border><left/><right/><top/><bottom/><diagonal/></border>";
        const thin = '<color rgb="FFBFBFBF"/>';
        const side = (pos, cur) => cur
          ? `<${pos} style="medium"><color rgb="FF0E7C5A"/></${pos}>`
          : `<${pos} style="thin">${thin}</${pos}>`;
        const cur = k === "cur";
        return "<border>" + side("left", cur) + side("right", cur)
             + side("top", false) + side("bottom", false) + "<diagonal/></border>";
      }).join("");
      const xfXml = this.xfs.map(o =>
        `<xf numFmtId="${o.num}" fontId="${o.f}" fillId="${o.fl}" borderId="${o.b}" xfId="0"`
        + ` applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"`
        + (o.num ? ' applyNumberFormat="1"' : "")
        + `><alignment horizontal="${o.al}" vertical="center"`
        + (o.wrap ? ' wrapText="1"' : "") + "/></xf>").join("");
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
        + `<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
        + `<fonts count="${this.fonts.length}">${fontXml}</fonts>`
        + `<fills count="${this.fills.length}">${fillXml}</fills>`
        + `<borders count="${this.borders.length}">${bXml}</borders>`
        + `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>`
        + `<cellXfs count="${this.xfs.length}">${xfXml}</cellXfs>`
        + `<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>`
        + `</styleSheet>`;
    } };
}

  // 병합 계산 (화면과 동일)
  const MERGE = [0, 1, 2];
  const mkey = (r, col) => col < 2 ? `b${r.blk}` : `b${r.blk}|${r.g[2]}`;
  const span = rows.map(() => ({}));
  for (const col of MERGE){
    let i = 0;
    while (i < rows.length){
      const k = mkey(rows[i], col);
      let j = i + 1;
      while (j < rows.length && mkey(rows[j], col) === k) j++;
      span[i][col] = j - i;
      for (let x = i + 1; x < j; x++) span[x][col] = 0;
      i = j;
    }
  }

  rows.forEach((r, ri) => {
    const R = ri + 2;
    r.g.forEach((g, i) => {
      if (MERGE.includes(i)){
        const n = span[ri][i];
        if (n === 0) return;
        if (n > 1) merges.push([R, i, R + n - 1, i]);
      }
      cells.push({ r: R, c: i, v: g || "", t: "s", s: body(r.k, false, "left", 0) });
    });
    let t = 0;
    for (let i = 0; i < W; i++){
      const v = r.v[i]; t += v;
      cells.push({ r: R, c: GCOLS.length + i, v, t: "n", s: body(r.k, i === CW.idx, "right", 1) });
    }
    cells.push({ r: R, c: NC - 1, v: r.totOverride != null ? r.totOverride : t, t: "n",
                 s: body(r.k, false, "right", 1) });
  });

  // 시트 XML
  const byRow = new Map();
  for (const c of cells){ if (!byRow.has(c.r)) byRow.set(c.r, []); byRow.get(c.r).push(c); }
  let sheet = "";
  for (const [r, list] of [...byRow.entries()].sort((a, b) => a[0] - b[0])){
    list.sort((a, b) => a.c - b.c);
    const inner = list.map(c => {
      const ref = colName(c.c) + (c.r + 1);
      if (c.t === "n") return `<c r="${ref}" s="${c.s}"><v>${c.v}</v></c>`;
      if (c.v === "")  return `<c r="${ref}" s="${c.s}"/>`;
      return `<c r="${ref}" s="${c.s}" t="inlineStr"><is><t xml:space="preserve">${XQ(c.v)}</t></is></c>`;
    }).join("");
    sheet += `<row r="${r + 1}"${r < 2 ? ' ht="30" customHeight="1"' : ""}>${inner}</row>`;
  }
  const colsXml = "<cols>"
    + GWIDTH.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${(w/7).toFixed(1)}" customWidth="1"/>`).join("")
    + `<col min="${GCOLS.length+1}" max="${GCOLS.length+W}" width="14" customWidth="1"/>`
    + `<col min="${NC}" max="${NC}" width="17" customWidth="1"/></cols>`;
  const mergeXml = merges.length
    ? `<mergeCells count="${merges.length}">`
      + merges.map(m => `<mergeCell ref="${colName(m[1])}${m[0]+1}:${colName(m[3])}${m[2]+1}"/>`).join("")
      + "</mergeCells>" : "";
  const dim = `A1:${colName(NC-1)}${rows.length + 2}`;
  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
    + `<dimension ref="${dim}"/>`
    + `<sheetViews><sheetView workbookViewId="0" showGridLines="0">`
    + `<pane xSplit="${GCOLS.length}" ySplit="2" topLeftCell="${colName(GCOLS.length)}3"`
    + ` activePane="bottomRight" state="frozen"/>`
    + `<selection pane="bottomRight" activeCell="${colName(GCOLS.length)}3" sqref="${colName(GCOLS.length)}3"/>`
    + `</sheetView></sheetViews>`
    + `<sheetFormatPr defaultRowHeight="15"/>`
    + colsXml
    + `<sheetData>${sheet}</sheetData>`
    + mergeXml
    + `</worksheet>`;

  const unit = PERIOD === "week" ? "주차별" : "월별";
  const name = `${unit}집계_${GROUP === "전체" ? "전체" : GROUP}`.replace(/[\\\/\?\*\[\]:]/g, "").slice(0, 31);
  const files = [
    { name: "[Content_Types].xml", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
      + `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
      + `<Default Extension="xml" ContentType="application/xml"/>`
      + `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`
      + `<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`
      + `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`
      + `</Types>` },
    { name: "_rels/.rels", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>`
      + `</Relationships>` },
    { name: "xl/workbook.xml", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"`
      + ` xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">`
      + `<sheets><sheet name="${XQ(name)}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>`
      + `<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`
      + `</Relationships>` },
    { name: "xl/styles.xml", data: S.xml() },
    { name: "xl/worksheets/sheet1.xml", data: sheetXml },
  ];
  const zip = zipStore(files);
  const d = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([zip], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = `${unit}_집계표_${GROUP}_${d}.xlsx`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  setStatus(`엑셀 파일을 내려받았습니다. (${unit} · ${GROUP} · 서식 포함)`, "ok");
  return { cells: cells.length, merges: merges.length, bytes: zip.length, rows: rows.length + 2, cols: NC };
}

function exportCSV(){
  const S = STATE; if (!S) return;
  const rows = buildRows(S, $("#q").value.trim(), GROUP);
  const esc = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g,'""')}"` : v;
  const out = [];
  out.push([...GCOLS.map(esc), ...AXIS().map(w => esc(`${w.l1}${w.range}`)), esc(TOTCOL)].join(","));
  for (const r of rows){
    let t = 0; for (let i = 0; i < r.v.length; i++) t += r.v[i];
    out.push([...r.g.map(esc), ...Array.from(r.v),
              r.totOverride != null ? r.totOverride : t].join(","));
  }
  const blob = new Blob(["\uFEFF" + out.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");

  a.download = `주차별_집계표_${GROUP === "전체" ? "전체" : GROUP}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}



/* ===== 이용자 수 계산 =====
   식별번호 컬럼이 있을 때만 정확합니다.
     · 로그인  : 식별번호로 중복 제거
     · 비로그인: 빈칸 → 행마다 1명으로 계수 (PNU 도우미 등)
   group/fam/chan 을 주면 그 범위만 셉니다. */
function sliceStat(miFrom, miTo, opt){
  const S = STATE;
  opt = opt || {};
  const nC = S.cidName.length;
  const cmask = new Uint8Array(nC);
  for (let i = 0; i < nC; i++){
    const nm = S.cidName[i];
    let ok = true;
    if (opt.group && opt.group !== "전체") ok = chanGroup(nm) === opt.group;
    if (ok && opt.chan) ok = nm === opt.chan;
    if (ok && opt.chanMatch) ok = opt.chanMatch(nm);
    cmask[i] = ok ? 1 : 0;
  }
  let fi = null;
  if (opt.fam){
    const k = S.famName.indexOf(opt.fam);
    if (k < 0) return { q: 0, uniq: 0, anon: 0, users: 0 };   // 데이터에 없는 계열
    fi = k;
  }
  const seen = new Set();
  let q = 0, anon = 0;
  for (let i = 0; i < S.rowN; i++){
    const m = S.aM[i];
    if (m < miFrom || m > miTo) continue;
    if (!cmask[S.aC[i]]) continue;
    if (fi !== null && S.aF[i] !== fi) continue;
    q++;
    const u = S.aU[i];
    if (u < 0) anon++; else seen.add(u);
  }
  return { q, uniq: seen.size, anon, users: seen.size + anon };
}

/* ================= 월간 보고 탭 =================
   총괄표            구분 | 누계 | 당월 | 전월 | 증감률
   모델별 이용 현황   구분 | AI 모델 | 질의 건 수 | 이용자 수 | 1인당 질의 수 | 전월 대비

   · 이용자 수(가) : 로그로 알 수 없어 비워 둔다 (별도 시스템 값)
   · 실 사용자 수  : 고유 식별번호 수 + 비로그인(빈칸) 행 수
   · 구버전 채널   : 본 채널에 합산 (PNU 도우미 (구버전) -> PNU 도우미)              */

const FAM2RPT = { GPT: "ChatGPT", GEMINI: "Gemini", CLAUDE: "Claude",
                  GEMMA: "Gemma", GROK: "Grok" };
const FAM_ROWS = ["GPT", "GEMINI", "CLAUDE", "GEMMA", "GROK"];

const nz = x => String(x).replace(/\s+/g, "");
/* 채널명이 기준 채널(또는 그 구버전)인지 */
function sameChan(nm, base){
  const n = nz(nm), b = nz(base);
  return n === b || n === b + "(구버전)";
}

const RPT_GROUPS = [
  { name: "MCP Beta", kind: "fam",
    match: nm => nz(nm) === "MCPBeta",
    rows: FAM_ROWS.map(f => ({ label: FAM2RPT[f], fam: f })) },
  { name: "PNU AI 에이전트", kind: "chan",
    rows: ["PNU 도우미", "행정 도우미", "학사 도우미"].map(c =>
      ({ label: c, chanMatch: nm => sameChan(nm, c) })) },
];

/* 한 칸(구분 x 행)의 월 집계 */
function rptCell(mi, g, row){
  const opt = {};
  if (g.kind === "fam"){ opt.chanMatch = g.match; opt.fam = row.fam; }
  else                 { opt.chanMatch = row.chanMatch; }
  const st = sliceStat(mi, mi, opt);
  return { q: st.q, u: STATE.hasUid ? st.users : null, uniq: st.uniq, anon: st.anon };
}
const inReport = nm => RPT_GROUPS.some(g => g.kind === "fam"
  ? g.match(nm) : g.rows.some(r => r.chanMatch(nm)));
/* 보고서에 포함된 채널 전체 합 (계 행) */
function rptTotal(a, b){
  const st = sliceStat(a, b, { chanMatch: inReport });
  return { q: st.q, u: STATE.hasUid ? st.users : null, uniq: st.uniq, anon: st.anon };
}

const per1 = (q, u) => (u && u > 0) ? (q / u).toFixed(1) : "—";
const pctCell = (cur, prev, ci) => {
  const A = ci == null ? "" : ` data-c="${ci}"`;
  if (prev == null) return `<td class="na"${A}>—</td>`;
  if (prev === 0) return cur === 0 ? `<td class="na"${A}>—</td>` : `<td class="up"${A}>신규</td>`;
  const r = (cur - prev) / prev * 100;
  const cls = r > 0 ? "up" : (r < 0 ? "dn" : "");
  const sign = r > 0 ? "▲" : (r < 0 ? "▼" : "");
  return `<td class="${cls}"${A}>${sign}${Math.abs(r).toFixed(1)}%</td>`;
};
/* 전월 대비 — 건수 차이(부호 포함) */
const diffCell = (cur, prev, ci) => {
  const A = ci == null ? "" : ` data-c="${ci}"`;
  if (prev == null) return `<td class="na"${A}>—</td>`;
  const d = cur - prev;
  if (d === 0) return `<td${A}>0</td>`;
  return `<td class="${d > 0 ? "up" : "dn"}"${A}>${d > 0 ? "+" : "-"}${fmt(Math.abs(d))}</td>`;
};

function renderReport(){
  const S = STATE; if (!S) return;
  const sel = $("#rmonth");
  if (sel.options.length !== S.months.length){
    sel.innerHTML = S.months.map((m, i) =>
      `<option value="${i}">${m.start.slice(0,4)}년 ${m.l1}</option>`).join("");
    sel.value = String(S.months.length - 1);
  }
  const mi = +sel.value, pi = mi - 1;

  $("#rscope").innerHTML = `기간 ${S.months[mi].start} ~ ${S.months[mi].end}`
    + ` · 누계는 ${S.months[0].start.slice(0,4)}년 ${S.months[0].l1} 부터`
    + (S.hasUid ? "" : ' · <b style="color:#8a1c1c">식별번호 컬럼 없음</b>');

  const cur = rptTotal(mi, mi), prev = pi >= 0 ? rptTotal(pi, pi) : null;
  const cum = rptTotal(0, mi);

  /* 총괄표 */
  const r1 = (label, pick, fmtFn) =>
    `<tr><td class="lbl sep" data-c="0">${label}</td>`
    + `<td class="num" data-c="1">${fmtFn(cum)}</td>`
    + `<td class="num" data-c="2">${fmtFn(cur)}</td>`
    + `<td class="num" data-c="3">${prev ? fmtFn(prev) : "—"}</td>`
    + pctCell(pick(cur), prev ? pick(prev) : null, 4) + "</tr>";
  $("#rpt1").innerHTML =
    '<thead><tr><th style="width:26%" data-c="0">구분</th><th data-c="1">누계</th>'
    + '<th data-c="2">당월</th><th data-c="3">전월</th><th data-c="4">증감률</th></tr></thead><tbody>'
    + r1("질의 건 수", x => x.q, x => fmt(x.q))
    + '<tr><td class="lbl sep" data-c="0">이용자 수</td><td class="na" data-c="1">—</td>'
    + '<td class="na" data-c="2">—</td><td class="na" data-c="3">—</td><td class="na" data-c="4">—</td></tr>'
    + r1("실 사용자 수", x => x.u, x => x.u == null ? "—" : fmt(x.u))
    + '<tr><td class="lbl sep" data-c="0">1인당 평균 질의 수</td>'
    + `<td class="num" data-c="1">${per1(cum.q, cum.u)}</td>`
    + `<td class="num" data-c="2">${per1(cur.q, cur.u)}</td>`
    + `<td class="num" data-c="3">${prev ? per1(prev.q, prev.u) : "—"}</td>`
    + pctCell(cur.u ? cur.q / cur.u : null, (prev && prev.u) ? prev.q / prev.u : null, 4)
    + "</tbody>";

  /* 모델별 이용 현황 */
  let body = "";
  let rowUserSum = 0;                 // 행별 이용자 수의 단순 합 (계와 다를 수 있음)
  for (const g of RPT_GROUPS){
    g.rows.forEach((row, i) => {
      const c = rptCell(mi, g, row);
      if (c.u != null) rowUserSum += c.u;
      const p = pi >= 0 ? rptCell(pi, g, row) : null;
      body += "<tr>"
        + (i === 0 ? `<td class="lbl grp" data-c="0" rowspan="${g.rows.length}">${escapeHtml(g.name)}</td>` : "")
        + `<td class="lbl sep" data-c="1">${escapeHtml(row.label)}</td>`
        + `<td class="num" data-c="2">${fmt(c.q)}</td>`
        + `<td class="num" data-c="3">${c.u == null ? "—" : fmt(c.u)}</td>`
        + `<td class="num" data-c="4">${per1(c.q, c.u)}</td>`
        + diffCell(c.q, p ? p.q : null, 5) + "</tr>";
    });
  }
  body += '<tr class="sum"><td class="lbl sep" data-c="0" colspan="2">계</td>'
       + `<td class="num" data-c="2">${fmt(cur.q)}</td>`
       + `<td class="num" data-c="3">${cur.u == null ? "—" : fmt(cur.u)}`
       + `${cur.u == null ? "" : '<span class="uniq">고유</span>'}</td>`
       + `<td class="num" data-c="4">${per1(cur.q, cur.u)}</td>`
       + diffCell(cur.q, prev ? prev.q : null, 5) + "</tr>";
  $("#rpt2").innerHTML =
    '<thead><tr><th style="width:15%" data-c="0">구분</th><th style="width:15%" data-c="1">AI 모델</th>'
    + '<th data-c="2">질의 건 수</th><th data-c="3">이용자 수 <span class=\"mk\">†</span></th><th data-c="4">1인당 질의 수</th><th data-c="5">전월 대비</th>'
    + `</tr></thead><tbody>${body}</tbody>`;

  /* 각주 */
  const excluded = [...new Set(S.cidName.filter(nm => !inReport(nm)))];
  const exQ = sliceStat(mi, mi, { chanMatch: nm => !inReport(nm) }).q;
  $("#rfoot").innerHTML =
    "※ <b>질의 건 수</b> = 로그 행 수 (중복 제거 없음). 시각은 UTC → KST 변환 후 달력 월 기준.<br>"
    + "※ <b>이용자 수</b>(총괄표)는 로그로 알 수 없어 비워 두었습니다. 별도 시스템 값을 넣으세요.<br>"
    + (S.hasUid
        ? "※ <b>실 사용자 수</b> · <b>이용자 수</b>(모델별) = 식별번호 고유 수 + 비로그인(빈칸) 행 수."
          + ` 당월 식별 ${fmt(cur.uniq)}명 + 비로그인 ${fmt(cur.anon)}건.<br>`
        : "※ <b>실 사용자 수</b> — 로그에 <b>식별번호 컬럼이 없어</b> 계산할 수 없습니다."
          + " 식별번호가 포함된 로그를 넣으면 자동 계산됩니다.<br>")
    + (cur.u != null && rowUserSum !== cur.u
        ? `※ <b>† 이용자 수는 더해지지 않습니다.</b> 행 합계 ${fmt(rowUserSum)} ≠ 계 ${fmt(cur.u)}`
          + ` (차이 ${fmt(Math.abs(rowUserSum - cur.u))}).`
          + ` 한 사람이 여러 모델·채널을 함께 쓰면 각 행에 들어가지만 <b>계에서는 1명</b>으로 셉니다.`
          + ` 질의 건수는 정상적으로 합산됩니다.<br>`
        : "")
    + "※ <b>구버전 채널은 본 채널에 합산</b>합니다 (PNU 도우미 (구버전) → PNU 도우미).<br>"
    + "※ 증감률 = (당월 − 전월) ÷ 전월 × 100 · 전월 대비 = 당월 − 전월 (건수).<br>"
    + "※ <b>계</b> 는 위 표의 채널만 더한 값입니다. 보고에서 빠진 채널 "
    + `${excluded.length}개 · 당월 ${fmt(exQ)}건`
    + (excluded.length
        ? ` (${excluded.slice(0,6).map(escapeHtml).join(", ")}`
          + (excluded.length > 6 ? ` 외 ${excluded.length-6}개` : "") + ")"
        : "")
    + ".";
}

/* 월간 보고 두 표를 서식 포함 xlsx 로 */
function exportReportXLSX(){

  const xTit = S.xf({ f: fB, fl: 0, b: 0, al: "left", num: 0 });

  const put = (r, c, v, t, st) => cells.push({ r, c, v, t, s: st });
  // DOM 표를 그대로 읽어 같은 값 보장
  let R = 0;
  for (const [title, id] of [["총괄표", "#rpt1"], ["모델별 이용 현황", "#rpt2"]]){
    put(R, 0, title, "s", xTit); R += 1;
    const tb = $(id);
    for (const tr of tb.querySelectorAll("tr")){
      const isHead = tr.parentElement.tagName === "THEAD";
      const isSum  = tr.classList.contains("sum");
      [...tr.children].forEach((cell, idx) => {
        const ci = cell.dataset.c != null ? +cell.dataset.c : idx;
        const txt = cell.textContent.trim();
        const plain = txt.replace(/,/g, "");
        const isNum = ci > 0 && /^-?\d+(\.\d+)?$/.test(plain);
        if (isHead)      put(R, ci, txt, "s", xHdr);
        else if (ci === 0) put(R, ci, txt, "s", isSum ? xSL : xLbl);
        else if (isNum)  put(R, ci, Number(plain), "n", isSum ? xSN : xNum);
        else             put(R, ci, txt, "s", isSum ? xST : xTxt);
      });
      R += 1;
    }
    R += 1;
  }
  const mLabel = $("#rmonth").selectedOptions[0].textContent;
  put(R, 0, `대상: ${GROUP} · ${mLabel}`, "s", xTit); R += 1;
  put(R, 0, STATE.hasUid
      ? "※ 실 사용자 수 = 식별번호 고유 수 + 비로그인(빈칸) 행 수 · 구버전 채널은 본 채널에 합산"
      : "※ 실 사용자 수 — 로그에 식별번호 컬럼이 없어 계산할 수 없습니다", "s", xTit);
  R += 1;
  put(R, 0, "※ 이용자 수(총괄표)는 로그로 알 수 없어 비워 둠 · 계 = 위 표의 채널만 합산", "s", xTit);

  const byRow = new Map();
  for (const c of cells){ if (!byRow.has(c.r)) byRow.set(c.r, []); byRow.get(c.r).push(c); }
  let sheet = "";
  for (const [r, list] of [...byRow.entries()].sort((a, b) => a[0] - b[0])){
    list.sort((a, b) => a.c - b.c);
    sheet += `<row r="${r + 1}">` + list.map(c => {
      const ref = colName(c.c) + (c.r + 1);
      if (c.t === "n") return `<c r="${ref}" s="${c.s}"><v>${c.v}</v></c>`;
      if (c.v === "")  return `<c r="${ref}" s="${c.s}"/>`;
      return `<c r="${ref}" s="${c.s}" t="inlineStr"><is><t xml:space="preserve">${XQ(c.v)}</t></is></c>`;
    }).join("") + `</row>`;
  }
  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
    + `<dimension ref="A1:F${R + 1}"/>`
    + `<sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews>`
    + `<sheetFormatPr defaultRowHeight="15"/>`
    + `<cols><col min="1" max="1" width="24" customWidth="1"/>`
    + `<col min="2" max="5" width="15" customWidth="1"/></cols>`
    + `<sheetData>${sheet}</sheetData></worksheet>`;
  const name = "월간보고";
  const files = [
    { name: "[Content_Types].xml", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
      + `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
      + `<Default Extension="xml" ContentType="application/xml"/>`
      + `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`
      + `<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`
      + `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>`
      + `</Types>` },
    { name: "_rels/.rels", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>`
      + `</Relationships>` },
    { name: "xl/workbook.xml", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"`
      + ` xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">`
      + `<sheets><sheet name="${name}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", data:
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
      + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
      + `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>`
      + `<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`
      + `</Relationships>` },
    { name: "xl/styles.xml", data: S.xml() },
    { name: "xl/worksheets/sheet1.xml", data: sheetXml },
  ];
  const zip = zipStore(files);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([zip], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = `월간보고_${mLabel.replace(/\s/g, "")}_${GROUP}.xlsx`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  setStatus(`월간 보고 엑셀을 내려받았습니다. (${mLabel} · ${GROUP})`, "ok");
  return { cells: cells.length, bytes: zip.length };
}

/* ---------- 데이터 파일 자동 탐색 ----------
   index.html 과 같은 폴더에 아래 이름 중 하나가 있으면 자동으로 읽습니다.
   GitHub Pages 에 올릴 때는 이 파일도 같은 폴더에 함께 올리면 됩니다.          */
/* 파일로 직접 열었는지(file://) — 그 경우 같은 폴더 파일을 자동으로 못 읽는다 */
const IS_FILE = location.protocol === "file:";
const DATA_DIR = "로그데이터/";     // 이 폴더 안의 모든 파일을 자동으로 합산
const CANDIDATES = [               // 폴더가 없을 때 쓰는 단일 파일 후보
  "로그데이터.xlsx", "로그.xlsx", "데이터.xlsx", "log.xlsx", "data.xlsx",
]

/* ---------- 파일 읽기 ---------- */
function isXlsx(name){ return /\.xlsx$/i.test(name); }

/* xlsx 는 SheetJS 로 파싱해 CSV 문자열로 변환 */
async function xlsxToCsv(buf, label){
  if (typeof XLSX === "undefined")
    throw new Error("xlsx 를 읽으려면 SheetJS 가 필요합니다. 인터넷 연결을 확인하거나 CSV 를 쓰세요.");
  const wb = XLSX.read(buf, { type: "array", dense: true, raw: true, cellDates: false });
  const ws = wb.Sheets[wb.SheetNames[0]];
  if (!ws) throw new Error(`${label}: 시트를 찾을 수 없습니다.`);
  return XLSX.utils.sheet_to_csv(ws, { FS: ",", RS: "\n", rawNumbers: true });
}

/* UTF-8 우선, 한글 헤더가 깨지면 CP949 로 재디코딩 */
function decodeCsv(buf){
  let t = new TextDecoder("utf-8").decode(buf);
  if (!NEED.some(k => t.slice(0, 400).includes(k))){
    try{
      const t2 = new TextDecoder("euc-kr").decode(buf);
      if (NEED.some(k => t2.slice(0, 400).includes(k))) t = t2;
    }catch(e){}
  }
  return t.replace(/^\uFEFF/, "");
}

async function textFromBuffer(buf, name){
  return isXlsx(name) ? await xlsxToCsv(buf, name) : decodeCsv(buf);
}

/* 로그데이터/ 폴더 안의 파일 목록을 찾는다. 세 경로를 순서대로 시도한다.
     (1) 폴더 목록 HTML  — 로컬 python http.server (열기.bat). 항상 최신
     (2) GitHub API      — github.io 에서 공개 저장소면 자동. manifest 갱신 불필요
     (3) manifest.json   — 그 밖의 호스팅 / 비공개 저장소용 수동 목록            */
const DATA_EXT = /\.(xlsx|csv|txt)$/i;
const SKIP_NAME = /여기에_로그파일을_넣으세요|manifest/;
const pickNames = arr => [...new Set(
  arr.filter(n => typeof n === "string" && DATA_EXT.test(n)
                  && !/^~\$/.test(n) && !SKIP_NAME.test(n)))].sort();

/* (1) 디렉터리 목록 HTML */
async function discoverViaListing(){
  let html;
  try{
    const r = await fetch(DATA_DIR, { cache: "no-store" });
    if (!r.ok) return null;
    html = await r.text();
  }catch(e){ return null; }
  if (!/<a\s/i.test(html)) return null;
  const doc = new DOMParser().parseFromString(html, "text/html");
  const out = [];
  for (const a of doc.querySelectorAll("a[href]")){
    const href = a.getAttribute("href");
    if (!href || href.startsWith("/") || href.startsWith("?") || href.includes("..")) continue;
    let nm;
    try{ nm = decodeURIComponent(href.replace(/\/$/, "")); }catch(e){ nm = href; }
    out.push(nm);
  }
  const names = pickNames(out);
  return names.length ? names : null;
}

/* (2) GitHub Contents API — 공개 저장소면 목록을 그대로 받아온다 */
function githubRepoInfo(){
  const h = location.hostname;
  if (!/\.github\.io$/i.test(h)) return null;
  const owner = h.replace(/\.github\.io$/i, "");
  const seg = location.pathname.split("/").filter(Boolean);
  // 프로젝트 페이지면 첫 경로가 저장소명, 사용자 페이지면 <owner>.github.io
  const repo = seg.length ? seg[0] : `${owner}.github.io`;
  return { owner, repo };
}
async function discoverViaGitHubAPI(info){
  info = info || githubRepoInfo();
  if (!info) return null;
  const dir = DATA_DIR.replace(/\/$/, "");
  const url = `https://api.github.com/repos/${info.owner}/${info.repo}`
            + `/contents/${encodeURIComponent(dir)}`;
  try{
    const r = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) return null;                 // 비공개 저장소 / 호출 한도 초과 등
    const j = await r.json();
    if (!Array.isArray(j)) return null;
    const names = pickNames(j.filter(x => x.type === "file").map(x => x.name));
    return names.length ? names : null;
  }catch(e){ return null; }
}

/* (3) manifest.json */
async function discoverViaManifest(){
  try{
    const r = await fetch(DATA_DIR + "manifest.json", { cache: "no-store" });
    if (!r.ok) return null;
    const j = await r.json();
    const names = pickNames(Array.isArray(j) ? j : (j.files || []));
    return names.length ? names : null;
  }catch(e){ return null; }
}

async function discoverFiles(){
  return (await discoverViaListing())
      || (await discoverViaGitHubAPI())
      || (await discoverViaManifest())
      || null;
}

/* ---------- 실행 ---------- */
let RUN = 0;          // 마지막 실행만 화면에 반영
let LAST = null;      // {mode:'auto'} 또는 {mode:'files', files:[File]}

async function runAggregate(tables, tzMode, my){
  if (my !== RUN) return;
  setStatus("집계 중…", "info");
  await new Promise(r => setTimeout(r));
  STATE = aggregate(tables, tzMode);
  render();
  renderSrcStat();
  showDrop(false);
  setStatus(`완료 — ${fmt(STATE.total)}건 / ${STATE.weeks.length}주차 · ${new Date().toLocaleString("ko-KR")}`, "ok");
}

/* 로그데이터/ 폴더 안의 파일 목록을 찾는다.
   (1) manifest.json 이 있으면 그걸 사용   ← GitHub Pages 등 목록을 안 주는 호스팅
   (2) 없으면 폴더 목록 HTML 을 파싱        ← python http.server (열기.bat) */
async function discoverFiles(){
  // (1) manifest
  try{
    const r = await fetch(DATA_DIR + "manifest.json", { cache: "no-store" });
    if (r.ok){
      const j = await r.json();
      const arr = Array.isArray(j) ? j : (j.files || []);
      const names = arr.filter(n => typeof n === "string" && /\.(xlsx|csv|txt)$/i.test(n));
      if (names.length) return names;
    }
  }catch(e){}
  // (2) 디렉터리 목록 HTML
  let html;
  try{
    const r = await fetch(DATA_DIR, { cache: "no-store" });
    if (!r.ok) return null;
    html = await r.text();
  }catch(e){ return null; }
  if (!/<a\s/i.test(html)) return null;
  const doc = new DOMParser().parseFromString(html, "text/html");
  const names = [];
  for (const a of doc.querySelectorAll("a[href]")){
    const href = a.getAttribute("href");
    if (!href || href.startsWith("/") || href.startsWith("?") || href.includes("..")) continue;
    let nm;
    try{ nm = decodeURIComponent(href.replace(/\/$/, "")); }catch(e){ nm = href; }
    if (/\.(xlsx|csv|txt)$/i.test(nm) && !/^~\$/.test(nm)
        && !/여기에_로그파일을_넣으세요|manifest/.test(nm)) names.push(nm);
  }
  return [...new Set(names)].sort();
}

async function loadAuto(silent){
  const my = ++RUN;
  LAST = { mode: "auto" };
  $("#reload").disabled = true;
  try{
    // (1) 로그데이터/ 폴더 안의 모든 파일
    const names = await discoverFiles();
    if (names && names.length){
      const tables = [], failed = [];
      for (let i = 0; i < names.length; i++){
        if (my !== RUN) return false;
        const nm = names[i];
        setStatus(`폴더에서 읽는 중… (${i+1}/${names.length}) ${nm}`, "info");
        try{
          const r = await fetch(DATA_DIR + encodeURIComponent(nm), { cache: "no-store" });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const buf = await r.arrayBuffer();
          if (isXlsx(nm)){
            setStatus(`${nm} (${(buf.byteLength/1e6).toFixed(1)} MB) 변환 중…`
                      + ` ${chr10()}xlsx 는 파일당 20초쯤 걸립니다.`, "info");
            await new Promise(r2 => setTimeout(r2, 30));
          }
          tables.push({ tab: `${nm}  ${(buf.byteLength/1e6).toFixed(1)} MB`,
                        text: await textFromBuffer(buf, nm) });
        }catch(e){ failed.push({ label: nm, err: e.message }); }
      }
      if (!tables.length) throw new Error(`${DATA_DIR} 안의 파일을 읽지 못했습니다.${chr10()}`
        + failed.map(f => `· ${f.label}: ${f.err}`).join(chr10()));
      await runAggregate(tables, $("#tz").value, my);
      if (STATE){ STATE.failed = failed; renderSrcStat(); }
      return true;
    }

    // (2) 폴더가 없으면 루트의 단일 파일
    const tried = [];
    for (const name of CANDIDATES){
      if (my !== RUN) return false;
      setStatus(`${name} 찾는 중…`, "info");
      let r;
      try{
        r = await fetch(encodeURI(name), { cache: "no-store" });
      }catch(e){
        if (!silent) setStatus(`네트워크 오류: ${e.message}`, "err");
        return false;
      }
      if (!r.ok){ tried.push(`${name} (HTTP ${r.status})`); continue; }
      const buf = await r.arrayBuffer();
      setStatus(`${name} (${(buf.byteLength/1e6).toFixed(1)} MB) 읽는 중…`
                + (isXlsx(name) ? `${chr10()}xlsx 는 변환에 20초쯤 걸립니다. 잠시 기다려 주세요.` : ""), "info");
      await new Promise(r2 => setTimeout(r2, 30));
      const text = await textFromBuffer(buf, name);
      await runAggregate([{ tab: `${name}  ${(buf.byteLength/1e6).toFixed(1)} MB`, text }], $("#tz").value, my);
      return true;
    }
    if (!silent)
      setStatus(`${DATA_DIR} 폴더도, ${CANDIDATES.join(" / ")} 도 찾지 못했습니다.`
        + (tried.length ? ` (${tried.join(", ")})` : ""), "err");
    return false;
  }catch(e){
    if (my === RUN && !silent) setStatus("오류: " + e.message, "err");
    return false;
  }finally{
    if (my === RUN) $("#reload").disabled = !LAST;
  }
}
function chr10(){ return String.fromCharCode(10); }

/* 사용자가 직접 고른 파일들 */
async function loadFiles(fileList){
  const my = ++RUN;
  const files = [...fileList].filter(f => /\.(csv|txt|xlsx)$/i.test(f.name));
  if (!files.length){ setStatus("csv 또는 xlsx 파일을 선택하세요.", "err"); return; }
  LAST = { mode: "files", files };
  $("#reload").disabled = true;
  try{
    const tables = [], failed = [];
    for (let i = 0; i < files.length; i++){
      if (my !== RUN) return;
      setStatus(`읽는 중… (${i+1}/${files.length}) ${files[i].name}  ${(files[i].size/1e6).toFixed(1)} MB`, "info");
      await new Promise(r => setTimeout(r));
      try{
        const b = await files[i].arrayBuffer();
        if (isXlsx(files[i].name)){
          setStatus(`${files[i].name} 변환 중… xlsx 는 20초쯤 걸립니다.`, "info");
          await new Promise(r2 => setTimeout(r2, 30));
        }
        tables.push({ tab: `${files[i].name}  ${(files[i].size/1e6).toFixed(1)} MB`,
                      text: await textFromBuffer(b, files[i].name) });
      }catch(e){ failed.push({ label: files[i].name, err: e.message }); }
    }
    if (!tables.length) throw new Error("파일을 읽지 못했습니다.\n" +
      failed.map(f => `· ${f.label}: ${f.err}`).join("\n"));
    await runAggregate(tables, $("#tz").value, my);
    if (STATE) { STATE.failed = failed; renderSrcStat(); }
  }catch(e){
    if (my === RUN) setStatus("오류: " + e.message, "err");
  }finally{
    if (my === RUN) $("#reload").disabled = false;
  }
}

function reload(){
  if (LAST && LAST.mode === "files") loadFiles(LAST.files);
  else if (!IS_FILE) loadAuto();
  else setStatus("파일을 다시 선택해 주세요. (file:// 에서는 자동으로 읽을 수 없습니다)", "err");
}

function renderSrcStat(){
  const S = STATE; if (!S) return;
  const rows = S.srcStats.map(s =>
    `<tr><td>${escapeHtml(s.label)}</td><td class="n">${fmt(s.raw)}행</td>`
    + `<td>${s.bad ? `날짜 해석 불가 ${fmt(s.bad)}행 제외` : "―"}</td>`
    + `<td class="${s.cross ? "bad" : ""}">${s.cross ? `다른 파일과 겹침 ${fmt(s.cross)}건` : "―"}</td></tr>`);
  for (const f of (S.failed || []))
    rows.push(`<tr><td class="bad">${escapeHtml(f.label)}</td><td class="bad" colspan="3">${escapeHtml(f.err)}</td></tr>`);
  let warn = "";
  if (S.crossDup > 0){
    warn = `<div class="dupwarn"><b>⚠ 파일 간 중복 ${fmt(S.crossDup)}건</b> — `
      + `서로 다른 파일에 같은 Chat ID 가 들어 있습니다. `
      + `중복 제거를 하지 않으므로 <b>그만큼 건수가 부풀려집니다.</b> `
      + `겹치는 파일 하나를 폴더에서 빼주세요.<br>`
      + S.crossPairs.slice(0, 5).map(([k, n]) => `· ${escapeHtml(k)} : ${fmt(n)}건`).join("<br>")
      + (S.crossPairs.length > 5 ? `<br>· … 외 ${S.crossPairs.length - 5}쌍` : "")
      + `</div>`;
  }
  // 파일 목록은 기본 접힘 — 요약 줄을 누르면 펼쳐진다 (파일이 수십 개가 되므로)
  const nf = S.nFiles || S.srcStats.length;
  const bad = (S.failed || []).length;
  $("#srcstat").innerHTML = warn
    + `<details class="srcfold"${bad ? " open" : ""}>`
    + `<summary>읽은 파일 <b>${fmt(nf)}개</b>`
    + ` · ${fmt(S.nRaw)}행 → 집계 <b>${fmt(S.total)}건</b>`
    + (bad ? ` · <span class="bad">실패 ${bad}개</span>` : "")
    + `<span class="srchint">목록 보기</span></summary>`
    + `<table>${rows.join("")}</table>`
    + `</details>`;
  $("#srcstat").className = "on";
}

const drop = $("#drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault(); drop.classList.add("over");
}));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => {

}));
drop.addEventListener("drop", e => {
  if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
});
// 페이지 어디에 놓아도 받도록
["dragover","drop"].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
$("#files").onchange = e => loadFiles(e.target.files);
$("#reload").onclick = reload;
$("#csv").onclick    = exportCSV;
$("#xlsx").onclick   = exportXLSXStyled;
$("#q").oninput      = () => { if (STATE) render(); };
function setDepth(d){
  DEPTH = d;
  FOLD_CH.clear(); FOLD_FAM.clear();
  if (!STATE) return;
  if (d === "chan"){
    for (const c of STATE.cells) FOLD_CH.add(c.name);
  } else if (d === "fam"){
    for (const c of STATE.cells) FOLD_FAM.add(c.name + "␀" + c.fam);
  }
  render();
}
for (const b of document.querySelectorAll("#depth button"))
  b.onclick = () => setDepth(b.dataset.d);

$("#rmonth").onchange = () => renderReport();
$("#rxlsx").onclick   = () => exportReportXLSX();

for (const b of document.querySelectorAll("#tabs button"))
  b.onclick = () => {
    if (PERIOD === b.dataset.p) return;
    PERIOD = b.dataset.p;
    FOCUSED = false;                 // 탭을 바꾸면 오늘 위치로 다시 이동
    render();
  };
$("#tz").onchange    = () => {
  try{ localStorage.setItem(LS, JSON.stringify({ tz: $("#tz").value })); }catch(e){}
  if (LAST) reload();
};

try{
  const c = JSON.parse(localStorage.getItem(LS) || "{}");
  if (c.tz) $("#tz").value = c.tz;
}catch(e){}

function showDrop(on){ $("#drop").classList.toggle("hide", !on); }

(async () => {
  // http/https 로 열렸으면 같은 폴더의 xlsx 를 자동으로 읽는다 (열기.bat)
  if (!IS_FILE){
    const ok = await loadAuto(true);
    if (ok) return;
    showDrop(true);
    setStatus(`같은 폴더에서 ${CANDIDATES.join(" 또는 ")} 을 찾지 못했습니다. 파일을 직접 선택하세요.`, "err");
    return;
  }
  // file:// (index.html 더블클릭) 에서는 브라우저가 옆 파일을 못 읽으므로 직접 선택
  showDrop(true);
  $("#dropTitle").textContent = "로그데이터.xlsx 를 여기로 끌어다 놓으세요";
  $("#dropNote").innerHTML =
    "이 페이지를 파일로 직접 열었기 때문에(<code>file://</code>) 브라우저가 같은 폴더의 xlsx 를 "
    + "자동으로 읽지 못합니다. 위로 끌어다 놓거나 아래 버튼으로 고르세요. (변환에 20초쯤)"
    + "<br><b>한 번 읽은 뒤 상단의 ‘데이터.js 저장’ 을 눌러 같은 폴더에 두면, "
    + "다음부터는 이 파일을 더블클릭하는 것만으로 바로 열립니다.</b>";
  setStatus("데이터 파일을 선택하면 집계를 시작합니다.", "info");
})();
</script>
